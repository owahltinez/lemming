name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Before the Python tests, not after: they exercise the readability
      # CLI, which runs the web tooling this installs. readability uses a
      # project's own node_modules copy when there is one, so running the
      # tests first silently swapped the pinned biome for whatever version
      # its fallback fetched, and checked this repo's config with a tool
      # generations newer than the config.
      - name: Install Node.js dependencies
        run: npm install

      - name: Run Python linting
        run: uv run ruff check .

      - name: Run Python formatting check
        run: uv run ruff format --check .

      - name: Run Python tests
        run: uv run pytest

      - name: Run Web linting
        run: npm run lint

      - name: Run Web check
        run: npm run check

      - name: Run Web tests
        run: |
          npx playwright install --with-deps
          npm test

      - name: Build container image
        run: docker build -t lemming:ci .
