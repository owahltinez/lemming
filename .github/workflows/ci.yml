name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.14'

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      # Before the Python tests: they invoke readability, which runs this.
      - name: Install Node.js dependencies
        run: npm install

      # Runs ruff and ruff format as before, and adds the type and prose
      # checks the separate steps never covered.
      - name: Run linting
        run: uv run readability check .

      - name: Run Python tests
        run: uv run pytest

      - name: Run Web linting
        run: npm run lint

      - name: Run Web check
        run: npm run check

      - name: Run Web tests
        run: |
          npx playwright install --with-deps
          npm test

      - name: Build container image
        run: docker build -t lemming:ci .
